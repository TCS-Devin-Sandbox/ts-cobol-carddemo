spring:
  application:
    name: carddemo-trantype-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${DB_USERNAME:carddemo}
    password: ${DB_PASSWORD:carddemo}
    hikari:
      # Bounded lock wait so a blocked UPDATE surfaces as a lock conflict (DB2 SQLCODE -911).
      connection-init-sql: SET lock_timeout = '${carddemo.db.lock-timeout:5s}'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

carddemo:
  db:
    lock-timeout: 5s
  security:
    jwt-secret: ${CARDDEMO_JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
    token-ttl: 1h
    cors-origins:
      - http://localhost:5173
    users:
      # CardDemo sample users (USRSEC). Passwords are BCrypt hashes of PASSWORD.
      - id: ADMIN001
        password: "{bcrypt}$2a$10$CZmgMdMHabe31xP.RcXf7ePxxOVW9jsPKEEFK4xo8yxPn2npwSY6u"
        type: A
      - id: USER0001
        password: "{bcrypt}$2a$10$CZmgMdMHabe31xP.RcXf7ePxxOVW9jsPKEEFK4xo8yxPn2npwSY6u"
        type: U

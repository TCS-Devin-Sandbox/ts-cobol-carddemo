# PostgreSQL 15 for carddemo-trantype-api (schema/seed applied by Flyway on API start-up).
services:
  postgres:
    image: postgres:15-alpine
    container_name: carddemo-trantype-db
    environment:
      POSTGRES_DB: carddemo
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: carddemo
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carddemo -d carddemo"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - carddemo-trantype-data:/var/lib/postgresql/data

volumes:
  carddemo-trantype-data:

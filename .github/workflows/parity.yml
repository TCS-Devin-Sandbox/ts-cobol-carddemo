name: estate-parity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fees-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java/**/pom.xml
      - name: FEECALC documented examples and driver tests (no PL/I oracle)
        run: mvn -B -f java/pom.xml -pl fees -am test

  trantype-dynamic-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java/**/pom.xml

      - name: MNTTRDYN Java parity
        run: make parity-java CHAIN=trantype-dynamic

      - name: Upload MNTTRDYN parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trantype-dynamic-parity-report
          path: work/parity-java/report.md
          if-no-files-found: ignore

  trantype-update-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java/**/pom.xml

      - name: MNTTRDB2 Java parity
        run: make parity-java CHAIN=trantype-update

      - name: Upload MNTTRDB2 parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trantype-update-parity-report
          path: work/parity-java/report.md
          if-no-files-found: ignore

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build estate image and start services
        run: make up

      - name: Compile the estate (GnuCOBOL + Open COBOL ESQL)
        run: make build

      - name: Discovery graph is current
        run: make chain-graph-check

      - name: Golden-file parity for every chain and case
        run: make parity

      - name: Naive half-even reference fails only on the tie case
        run: |
          set +e
          make parity-naive CASE=i02-tie-half-cent; tie=$?
          make parity-naive CASE=i07-nontie-rounding; nontie=$?
          set -e
          test $tie -ne 0 || { echo "tie case unexpectedly passed"; exit 1; }
          test $nontie -eq 0 || { echo "non-tie case unexpectedly failed"; exit 1; }

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: work/parity/*.md
          if-no-files-found: ignore

  posting-parity-java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java/**/pom.xml

      - name: Build and test the posting candidate
        run: mvn -B -f java/pom.xml -pl posting -am verify

      - name: Compare POSTTRAN and TRANREPT against the legacy goldens
        run: |
          docker compose up -d --wait postgres
          make parity-java CHAIN=posting CANDIDATE='java -jar java/posting/target/carddemo-posting.jar'

      - name: Upload posting parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posting-parity-java
          path: work/parity-java/report.md
          if-no-files-found: ignore

  interest-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java/**/pom.xml

      - name: Start PostgreSQL 15
        run: docker compose up -d --wait postgres

      - name: INTCALC Java parity against the COBOL goldens
        run: make parity-java CHAIN=interest

      - name: Upload INTCALC parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interest-parity-report
          path: work/parity-java/report.md
          if-no-files-found: ignore

  trantype-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            carddemo-trantype-api/pom.xml
            java/**/pom.xml

      - name: Transaction-type API tests (Testcontainers PostgreSQL)
        working-directory: carddemo-trantype-api
        run: mvn -B verify

      - name: Spring Batch skeleton verification
        working-directory: java
        run: mvn -B verify

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: carddemo-trantype-ui/package-lock.json

      - name: Transaction-type UI tests
        working-directory: carddemo-trantype-ui
        run: |
          npm ci
          npm test

  read-masters-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java/**/pom.xml

      - name: Start PostgreSQL 15
        run: docker compose up -d --wait postgres

      - name: Read masters Java parity against the COBOL goldens
        run: make parity-java CHAIN=read-masters

      - name: Upload read-masters parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-masters-parity-report
          path: work/parity-java/report.md
          if-no-files-found: ignore

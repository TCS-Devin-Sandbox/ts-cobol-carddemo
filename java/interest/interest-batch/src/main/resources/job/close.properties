spring.application.name=interestClose
spring.main.banner-mode=off
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.batch.jdbc.table-prefix=interest_batch.BATCH_
spring.sql.init.mode=never
interest.close.jdbc-url=${INTEREST_PILOT_JDBC_URL:jdbc:postgresql://localhost:5432/carddemo}
interest.close.db-user=${INTEREST_PILOT_DB_USER:carddemo}
interest.close.db-password=${INTEREST_PILOT_DB_PASSWORD:carddemo}
interest.close.database=interest_close
interest.close.parm=2022071800
interest.close.cycle=fixture-cycle
interest.close.feed=INTCALC
interest.close.build-revision=INT-04-working-tree
interest.close.rule-revision=INT-R-v1
interest.close.clock=2022-07-05T10:00:00.00
interest.close.zone=UTC
interest.close.run-on-startup=false
logging.level.root=OFF
logging.level.com.carddemo.interest.job=INFO
logging.level.com.carddemo.interest.calc=INFO

spring.application.name=interest-batch-pilot
spring.main.banner-mode=off
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.batch.jdbc.table-prefix=interest_batch.BATCH_
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:pilot/schema-batch.sql,classpath:pilot/schema-pilot.sql
spring.datasource.url=${INTEREST_PILOT_JDBC_URL:jdbc:postgresql://localhost:5433/interest}
spring.datasource.username=${INTEREST_PILOT_DB_USER:interest}
spring.datasource.password=${INTEREST_PILOT_DB_PASSWORD:interest}
# INT-H02: opaque 10-byte PARM from INTCALC STEP15 (app/jcl/INTCALC.jcl:22)
interest.pilot.parm=2022071800
# INT-Q05 / TN-02: injected local wall clock; fixture profile freezes it (tools/runjcl/chains.json)
interest.pilot.clock=2022-07-05T10:00:00.00
interest.pilot.zone=UTC
# Pilot acceptance: a failed run commits no pilot outputs, so the whole run is one chunk.
interest.pilot.run-on-startup=false
logging.level.root=WARN
logging.level.com.carddemo.interest.pilot=INFO

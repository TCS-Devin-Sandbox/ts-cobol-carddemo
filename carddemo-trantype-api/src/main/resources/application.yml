spring:
  application:
    name: carddemo-trantype-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${DB_USER:carddemo}
    password: ${DB_PASSWORD:carddemo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration

carddemo:
  security:
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    token-ttl-minutes: 60
    users:
      - username: admin
        password: ${ADMIN_PASSWORD:admin123}
        roles: [ADMIN]
      - username: user
        password: ${USER_PASSWORD:user123}
        roles: [USER]

spring:
  application:
    name: carddemo-trantype-api
  datasource:
    hikari:
      connection-init-sql: SET lock_timeout = '${carddemo.db.lock-timeout:5s}'
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${DB_USER:carddemo}
    password: ${DB_PASSWORD:carddemo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration

carddemo:
  security:
    jwt-secret: ${JWT_SECRET}
    token-ttl-minutes: 60
    users:
      - username: admin
        password: ${ADMIN_PASSWORD}
        roles: [ADMIN]
      - username: user
        password: ${USER_PASSWORD}
        roles: [USER]
